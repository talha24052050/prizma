name: release
# Pushing a tag like v1.0 builds the APK and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Game logic tests
        run: ./gradlew :core:test
      - name: Build release APK
        run: ./gradlew :app:assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "prizma-$TAG.apk"
          gh release create "$TAG" "prizma-$TAG.apk" --title "Prizma $TAG" --generate-notes
